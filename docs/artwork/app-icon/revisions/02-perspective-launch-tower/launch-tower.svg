<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Neo Notational V — red Saturn V launch tower and crane</title>
  <desc>A red open-lattice launch tower, service platforms, flared lower supports, and a left-facing hammerhead crane. Drawn from the user-supplied launchpad photograph. The transparent spaces between the girders remain open. Layer this drawing behind the Saturn V.</desc>

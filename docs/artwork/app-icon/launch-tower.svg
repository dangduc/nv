<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Neo Notational V — red launch tower, front elevation</title>
  <desc>A flat orthographic front view of a red launch tower and left-facing crane. Open lattice girders, service platforms, lower supports, and a rectangular launcher deck use solid colors and fine outlines. There are no perspective side faces. Layer this drawing behind the Saturn V.</desc>

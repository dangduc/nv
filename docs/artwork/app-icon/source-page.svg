  <title>Neo Notational V — Apollo 11 continuous-feed paper</title>
  <desc>Two stacked sheets of peach (#FDE9D9) continuous-feed dot-matrix printer paper, with punched tractor-feed holes and perforated tear-off margins. The supplied Apollo 11 AGC assembly excerpt is printed in black. Layer saturn-v.svg above this file on the same 1024 by 1024 canvas.</desc>
  <metadata>Source: https://github.com/chrislgarry/Apollo-11/blob/master/Comanche055/REENTRY_CONTROL.agc . The source header identifies the code as public domain. The excerpt text was supplied by the user. See SOURCES.md.</metadata>
